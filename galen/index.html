<!doctype html><html lang="ru"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Galen</title><link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin><link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap" rel="stylesheet"><style>*{box-sizing:border-box}html,body{margin:0;height:100%;overflow:hidden}body{font-family:Inter,Arial,sans-serif;background:#f4f4f1;color:#0d0d0d}body:before{content:"GALEN";position:fixed;left:50%;top:49%;transform:translate(-50%,-50%);font-size:21vw;letter-spacing:-.12em;font-weight:900;color:rgba(0,0,0,.035);pointer-events:none}.shell{height:100vh;padding:24px;display:grid;grid-template-rows:auto 1fr auto;gap:22px}.top{display:flex;align-items:center;justify-content:space-between}.brand{font-size:12px;letter-spacing:.34em;font-weight:800}.links{display:flex;gap:22px}.links a{color:#666;text-decoration:none;font-size:14px}.status{display:flex;align-items:center;gap:10px;color:#666;font-size:14px}.dot{width:8px;height:8px;border-radius:50%;background:#111}.stage{display:grid;place-items:center;min-height:0}.chat{width:min(980px,100%);height:min(660px,100%);border:1px solid rgba(0,0,0,.08);border-radius:42px;background:rgba(255,255,255,.58);box-shadow:0 30px 120px rgba(0,0,0,.08);backdrop-filter:blur(18px);display:grid;grid-template-rows:auto 1fr}.chat-head{padding:30px 34px;border-bottom:1px solid rgba(0,0,0,.06);display:flex;justify-content:space-between;align-items:flex-start}.title small{font-size:11px;letter-spacing:.24em;color:#777}.title h1{margin:8px 0 0;font-size:64px;line-height:.86;letter-spacing:-.09em}.clear{border:0;border-radius:999px;background:#111;color:#fff;padding:13px 18px}.feed{padding:34px;overflow:auto;display:flex;flex-direction:column;gap:20px}.msg{display:flex;gap:14px;max-width:720px}.msg.user{margin-left:auto;flex-direction:row-reverse}.ava{width:38px;height:38px;min-width:38px;border-radius:50%;background:#111;color:#fff;display:grid;place-items:center;font-weight:800}.user .ava{background:#e7e7e2;color:#111}.bubble{padding:18px 20px;border-radius:24px;background:#fff;border:1px solid rgba(0,0,0,.06);line-height:1.65;font-size:16px}.user .bubble{background:#111;color:#fff}.chips{display:flex;flex-wrap:wrap;gap:10px;margin-left:52px}.chip{border:1px solid rgba(0,0,0,.08);background:rgba(255,255,255,.55);border-radius:999px;padding:10px 14px;color:#555;font-size:14px;cursor:pointer}.composer{width:min(980px,100%);margin:0 auto;border:1px solid rgba(0,0,0,.08);background:#fff;border-radius:34px;padding:10px;display:flex;align-items:flex-end;gap:10px;box-shadow:0 18px 70px rgba(0,0,0,.07)}textarea{flex:1;border:0;outline:0;resize:none;background:transparent;min-height:48px;max-height:150px;padding:14px 16px;font:16px Inter,Arial;color:#111}textarea::placeholder{color:#888}.send{width:112px;height:48px;border:0;border-radius:999px;background:#111;color:#fff;font-weight:700}.mobile-title{display:none}@media(max-width:760px){body:before{font-size:34vw;top:28%}.shell{padding:16px;gap:14px}.links{display:none}.status{display:none}.chat{border-radius:30px;height:100%}.chat-head{padding:24px}.title h1{font-size:54px}.chips{margin-left:0}.composer{border-radius:28px}.send{width:84px}.mobile-title{display:block}.brand{font-size:11px}}</style></head><body><main class="shell"><header class="top"><div class="brand">GALENITE</div><nav class="links"><a href="/">Main</a><a href="/ai-office">AI Office</a><a href="/products">Products</a></nav><div class="status"><span class="dot"></span><span>Galen online</span></div></header><section class="stage"><div class="chat"><div class="chat-head"><div class="title"><small>GALEN CHAT</small><h1>Ask Galen</h1></div><button class="clear" id="clearChat">Clear</button></div><div class="feed" id="messages"><div class="msg"><div class="ava">G</div><div class="bubble">Привет. Я Гален. Пиши задачу — разберу, структурирую и помогу довести до нормального решения.</div></div><div class="chips"><button class="chip">Придумай структуру страницы</button><button class="chip">Разбери идею продукта</button><button class="chip">Сделай текст короче</button></div></div></div></section><form class="composer" id="chatForm"><textarea id="messageInput" placeholder="Message Galen..."></textarea><button class="send">Send</button></form></main><script>const f=document.getElementById('chatForm'),i=document.getElementById('messageInput'),m=document.getElementById('messages'),c=document.getElementById('clearChat'),r=['Окей. Я бы начал с структуры, потом уже докручивал визуал.','Понял. Давай сделаем это проще, чище и сильнее по смыслу.','Да, тут лучше не усложнять: один главный акцент, потом короткий сценарий.'];function add(t,u){const w=document.createElement('div');w.className='msg '+(u?'user':'');w.innerHTML='<div class="ava">'+(u?'Y':'G')+'</div><div class="bubble"></div>';w.querySelector('.bubble').textContent=t;m.appendChild(w);m.scrollTop=m.scrollHeight}document.querySelectorAll('.chip').forEach(x=>x.onclick=()=>{i.value=x.textContent;i.focus()});i.oninput=()=>{i.style.height='auto';i.style.height=Math.min(i.scrollHeight,150)+'px'};f.onsubmit=e=>{e.preventDefault();const v=i.value.trim();if(!v)return;add(v,1);i.value='';i.style.height='48px';setTimeout(()=>add(r[Math.floor(Math.random()*r.length)],0),500)};c.onclick=()=>{m.innerHTML=''};</script></body></html>
