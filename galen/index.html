<!doctype html><html lang="ru"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Galen</title><style>*{box-sizing:border-box}html,body{margin:0;height:100%;overflow:hidden}body{font-family:Inter,Arial,sans-serif;background:#fff;color:#111}.app{height:100vh;display:grid;grid-template-columns:260px 1fr}.side{background:#f7f7f5;border-right:1px solid #e7e7e3;padding:14px;display:flex;flex-direction:column;gap:14px}.brand{height:42px;display:flex;align-items:center;padding:0 12px;font-size:12px;font-weight:800;letter-spacing:.28em}.new{border:1px solid #dededa;background:#fff;border-radius:12px;height:44px;padding:0 14px;text-align:left;font-weight:600;color:#111}.history{display:grid;gap:6px}.history a{padding:11px 12px;border-radius:10px;text-decoration:none;color:#3d3d3d;font-size:14px}.history a:hover{background:#ecece8}.side-foot{margin-top:auto;display:grid;gap:6px}.side-foot a{padding:10px 12px;border-radius:10px;text-decoration:none;color:#666;font-size:14px}.main{height:100vh;display:grid;grid-template-rows:58px 1fr auto}.top{height:58px;display:flex;align-items:center;justify-content:space-between;padding:0 22px;border-bottom:1px solid #ededeb}.model{font-weight:600}.status{font-size:14px;color:#777}.chat{overflow:auto;padding:28px 18px 160px}.inner{max-width:760px;margin:0 auto}.welcome{min-height:calc(100vh - 280px);display:flex;flex-direction:column;justify-content:center;align-items:center;text-align:center}.mark{width:74px;height:74px;object-fit:contain;animation:float 4s ease-in-out infinite;filter:drop-shadow(0 12px 30px rgba(0,0,0,.08))}@keyframes float{0%{transform:translateY(0)}50%{transform:translateY(-10px)}100%{transform:translateY(0)}}.welcome h1{margin:22px 0 0;font-size:32px;letter-spacing:-.04em}.welcome p{margin:12px 0 0;color:#777;line-height:1.6}.suggestions{margin-top:28px;display:grid;grid-template-columns:1fr 1fr;gap:10px;width:100%}.suggestions button{border:1px solid #e6e6e2;background:#fff;border-radius:16px;text-align:left;padding:16px;color:#333;font-size:14px;cursor:pointer}.suggestions button:hover{background:#f7f7f5}.msg{display:grid;grid-template-columns:36px 1fr;gap:14px;margin:24px 0}.ava{width:32px;height:32px;border-radius:50%;display:grid;place-items:center;background:#111;color:#fff;font-size:13px;font-weight:800}.msg.user .ava{background:#efefec;color:#111}.content{font-size:16px;line-height:1.7;padding-top:4px;white-space:pre-wrap}.composer-wrap{position:fixed;left:260px;right:0;bottom:0;padding:18px;background:linear-gradient(180deg,rgba(255,255,255,0),#fff 32%)}.composer{max-width:760px;margin:0 auto;background:#fff;border:1px solid #dededa;border-radius:24px;box-shadow:0 12px 40px rgba(0,0,0,.08);padding:10px;display:flex;gap:10px;align-items:flex-end}textarea{flex:1;border:0;outline:0;resize:none;min-height:44px;max-height:160px;padding:12px;font:16px Inter,Arial;background:transparent}.send{width:42px;height:42px;border:0;border-radius:50%;background:#111;color:#fff;font-weight:800}.hint{max-width:760px;margin:8px auto 0;text-align:center;color:#999;font-size:12px}@media(max-width:820px){.app{grid-template-columns:1fr}.side{display:none}.composer-wrap{left:0}.suggestions{grid-template-columns:1fr}.top{padding:0 16px}.chat{padding-inline:16px}}</style></head><body><main class="app"><aside class="side"><div class="brand">GALENITE</div><button class="new" id="clearChat">New chat</button><div class="history"><a href="#">Galen Chat</a><a href="/ai-office">AI Office</a><a href="/products">Products</a></div><div class="side-foot"><a href="/">Main page</a></div></aside><section class="main"><header class="top"><div class="model">Galen</div><div class="status">online</div></header><div class="chat" id="chat"><div class="inner" id="messages"><section class="welcome" id="welcome"><img class="mark" src="./Assets/galen.png" alt="Galen"><h1>How can I help?</h1><p>Galenite assistant for product, design, code and automation tasks.</p><div class="suggestions"><button>Придумай структуру страницы</button><button>Разбери идею продукта</button><button>Сократи и усили текст</button><button>Собери план реализации</button></div></section></div></div><div class="composer-wrap"><form class="composer" id="chatForm"><textarea id="messageInput" placeholder="Message Galen"></textarea><button class="send">↑</button></form><div class="hint">Galen can make mistakes. Check important details.</div></div></section></main><script>const f=document.getElementById('chatForm'),i=document.getElementById('messageInput'),m=document.getElementById('messages'),w=document.getElementById('welcome'),chat=document.getElementById('chat'),clear=document.getElementById('clearChat'),r=['Понял. Давай разложим это по структуре и уберем лишнее.','Окей. Я бы сделал это проще: один сильный экран, потом понятный сценарий.','Да. Тут лучше идти от задачи пользователя, а не от декоративных блоков.'];function add(text,user){if(w)w.remove();const el=document.createElement('div');el.className='msg '+(user?'user':'bot');el.innerHTML='<div class="ava">'+(user?'Y':'G')+'</div><div class="content"></div>';el.querySelector('.content').textContent=text;m.appendChild(el);chat.scrollTop=chat.scrollHeight}document.querySelectorAll('.suggestions button').forEach(b=>b.onclick=()=>{i.value=b.textContent;i.focus()});i.oninput=()=>{i.style.height='auto';i.style.height=Math.min(i.scrollHeight,160)+'px'};f.onsubmit=e=>{e.preventDefault();const v=i.value.trim();if(!v)return;add(v,1);i.value='';i.style.height='44px';setTimeout(()=>add(r[Math.floor(Math.random()*r.length)],0),450)};clear.onclick=()=>location.reload();</script></body></html>
