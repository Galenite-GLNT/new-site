<!doctype html><html lang="ru"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Galen</title><style>*{box-sizing:border-box}html,body{margin:0;height:100%;overflow:hidden}body{font-family:Inter,Arial,sans-serif;background:#fff;color:#111}.app{height:100vh;display:grid;grid-template-columns:260px 1fr}.side{background:#f7f7f5;border-right:1px solid #e7e7e3;padding:14px;display:flex;flex-direction:column;gap:14px;position:relative}.brand{height:42px;display:flex;align-items:center;padding:0 12px;font-size:12px;font-weight:800;letter-spacing:.28em}.new{border:1px solid #dededa;background:#fff;border-radius:12px;height:44px;padding:0 14px;text-align:left;font-weight:600;color:#111}.history{display:grid;gap:4px;overflow:auto}.chat-item{border:0;background:transparent;text-align:left;padding:10px 12px;border-radius:10px;color:#333;font-size:14px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;cursor:pointer}.chat-item:hover,.chat-item.active{background:#ecece8}.account-wrap{margin-top:auto;position:relative}.account-btn{width:100%;border:0;background:#ecece8;border-radius:16px;padding:12px;display:flex;align-items:center;gap:12px;text-align:left;cursor:pointer}.account-avatar{width:42px;height:42px;border-radius:50%;object-fit:cover;background:#111}.account-name{font-size:15px;font-weight:600}.account-plan{font-size:14px;color:#777;margin-top:2px}.account-menu{position:absolute;left:0;bottom:74px;width:100%;background:#fff;border:1px solid #e7e7e3;border-radius:22px;padding:10px;box-shadow:0 20px 60px rgba(0,0,0,.08);display:none}.account-menu.open{display:block}.menu-head{display:flex;align-items:center;gap:12px;padding:10px;border-bottom:1px solid #ededeb;margin-bottom:6px}.menu-list{display:grid;gap:2px}.menu-list a,.menu-list button{border:0;background:transparent;text-align:left;padding:12px;border-radius:12px;font-size:14px;color:#333;text-decoration:none;cursor:pointer}.menu-list a:hover,.menu-list button:hover{background:#f4f4f1}.main{height:100vh;display:grid;grid-template-rows:58px 1fr auto}.top{height:58px;display:flex;align-items:center;justify-content:space-between;padding:0 22px;border-bottom:1px solid #ededeb}.model{font-weight:600}.status{font-size:14px;color:#777}.chat{overflow:auto;padding:28px 18px 160px}.inner{max-width:760px;margin:0 auto}.welcome{min-height:calc(100vh - 280px);display:flex;flex-direction:column;justify-content:center;align-items:center;text-align:center}.mark{width:74px;height:74px;object-fit:contain;animation:float 4s ease-in-out infinite;filter:drop-shadow(0 12px 30px rgba(0,0,0,.08))}@keyframes float{0%{transform:translateY(0)}50%{transform:translateY(-10px)}100%{transform:translateY(0)}}.welcome h1{margin:22px 0 0;font-size:32px;letter-spacing:-.04em}.welcome p{margin:12px 0 0;color:#777;line-height:1.6}.suggestions{margin-top:28px;display:grid;grid-template-columns:1fr 1fr;gap:10px;width:100%}.suggestions button{border:1px solid #e6e6e2;background:#fff;border-radius:16px;text-align:left;padding:16px;color:#333;font-size:14px;cursor:pointer}.suggestions button:hover{background:#f7f7f5}.msg{display:flex;margin:24px 0}.msg.bot{justify-content:flex-start}.msg.user{justify-content:flex-end}.content{max-width:82%;font-size:16px;line-height:1.7;white-space:pre-wrap}.msg.user .content{background:#f4f4f1;border-radius:22px;padding:12px 16px}.composer-wrap{position:fixed;left:260px;right:0;bottom:0;padding:18px;background:linear-gradient(180deg,rgba(255,255,255,0),#fff 32%)}.composer{max-width:760px;margin:0 auto;background:#fff;border:1px solid #dededa;border-radius:24px;box-shadow:0 12px 40px rgba(0,0,0,.08);padding:10px;display:flex;gap:10px;align-items:flex-end}textarea{flex:1;border:0;outline:0;resize:none;min-height:44px;max-height:160px;padding:12px;font:16px Inter,Arial;background:transparent}.send{width:42px;height:42px;border:0;border-radius:50%;background:#111;color:#fff;font-weight:800}.hint{max-width:760px;margin:8px auto 0;text-align:center;color:#999;font-size:12px}@media(max-width:820px){.app{grid-template-columns:1fr}.side{display:none}.composer-wrap{left:0}.suggestions{grid-template-columns:1fr}.top{padding:0 16px}.chat{padding-inline:16px}}</style></head><body><main class="app"><aside class="side"><div class="brand">GALENITE</div><button class="new" id="newChat">New chat</button><div class="history" id="history"></div><div class="account-wrap"><div class="account-menu" id="accountMenu"></div><button class="account-btn" id="accountButton"><img class="account-avatar" id="accountAvatar" src="./Assets/galen.png"><div><div class="account-name" id="accountName">Авторизация</div><div class="account-plan" id="accountPlan">Нажмите чтобы войти</div></div></button></div></aside><section class="main"><header class="top"><div class="model" id="chatTitle">Galen</div><div class="status">online</div></header><div class="chat" id="chat"><div class="inner" id="messages"></div></div><div class="composer-wrap"><form class="composer" id="chatForm"><textarea id="messageInput" placeholder="Message Galen"></textarea><button class="send">↑</button></form><div class="hint">Galen can make mistakes. Check important details.</div></div></section></main><script>const f=document.getElementById('chatForm'),i=document.getElementById('messageInput'),m=document.getElementById('messages'),chat=document.getElementById('chat'),newChatBtn=document.getElementById('newChat'),historyEl=document.getElementById('history'),chatTitle=document.getElementById('chatTitle'),menu=document.getElementById('accountMenu'),accountBtn=document.getElementById('accountButton'),accountName=document.getElementById('accountName'),accountPlan=document.getElementById('accountPlan'),accountAvatar=document.getElementById('accountAvatar'),user=JSON.parse(localStorage.getItem('glnt_user')||'null'),uid=user?.id||'guest',storeKey='glnt_chats_'+uid,r=['Понял. Давай разложим это по структуре и уберем лишнее.','Окей. Я бы сделал это проще: один сильный экран, потом понятный сценарий.','Да. Тут лучше идти от задачи пользователя, а не от декоративных блоков.'];let state=JSON.parse(localStorage.getItem(storeKey)||'null')||{active:null,chats:[]};function save(){localStorage.setItem(storeKey,JSON.stringify(state))}function id(){return 'chat_'+Date.now()}function createChat(){const c={id:id(),title:'New chat',messages:[],createdAt:Date.now(),updatedAt:Date.now()};state.chats.unshift(c);state.active=c.id;save();renderAll()}function current(){return state.chats.find(c=>c.id===state.active)}function ensure(){if(!state.chats.length)createChat();else if(!current())state.active=state.chats[0].id;save()}function titleFrom(t){return t.trim().slice(0,34)||'New chat'}function renderHistory(){historyEl.innerHTML='';state.chats.forEach(c=>{const b=document.createElement('button');b.className='chat-item '+(c.id===state.active?'active':'');b.textContent=c.title;b.onclick=()=>{state.active=c.id;save();renderAll()};historyEl.appendChild(b)})}function welcome(){m.innerHTML='<section class="welcome"><img class="mark" src="./Assets/galen.png" alt="Galen"><h1>How can I help?</h1><p>Galenite assistant for product, design, code and automation tasks.</p><div class="suggestions"><button>Придумай структуру страницы</button><button>Разбери идею продукта</button><button>Сократи и усили текст</button><button>Собери план реализации</button></div></section>';document.querySelectorAll('.suggestions button').forEach(b=>b.onclick=()=>{i.value=b.textContent;i.focus()})}function renderMessages(){const c=current();chatTitle.textContent=c?.title&&c.title!=='New chat'?c.title:'Galen';if(!c||!c.messages.length){welcome();return}m.innerHTML='';c.messages.forEach(x=>addNode(x.text,x.role==='user',false));chat.scrollTop=chat.scrollHeight}function addNode(text,userMsg,scroll=true){const el=document.createElement('div');el.className='msg '+(userMsg?'user':'bot');el.innerHTML='<div class="content"></div>';el.querySelector('.content').textContent=text;m.appendChild(el);if(scroll)chat.scrollTop=chat.scrollHeight}function add(text,userMsg){const c=current();if(!c)return;if(!c.messages.length&&userMsg)c.title=titleFrom(text);c.messages.push({role:userMsg?'user':'bot',text,ts:Date.now()});c.updatedAt=Date.now();state.chats.sort((a,b)=>b.updatedAt-a.updatedAt);save();renderHistory();renderMessages()}function renderAll(){ensure();renderHistory();renderMessages()}if(user){accountName.textContent=user.first_name||user.username||'User';accountPlan.textContent='Plus';if(user.photo_url)accountAvatar.src=user.photo_url;menu.innerHTML='<div class="menu-head"><img class="account-avatar" src="'+accountAvatar.src+'"><div><div class="account-name">'+accountName.textContent+'</div><div class="account-plan">@'+(user.username||'user')+'</div></div></div><div class="menu-list"><a href="#">Персонализация</a><a href="#">Профиль</a><a href="#">Настройки</a><button id="logoutBtn">Выйти</button></div>';setTimeout(()=>{const l=document.getElementById('logoutBtn');if(l)l.onclick=async()=>{try{await fetch('https://api.galenite.ru/api/auth/logout',{method:'POST',credentials:'include'})}catch{}localStorage.removeItem('glnt_user');localStorage.removeItem('glnt_logged_in');location.reload()}},0)}else{menu.innerHTML='<div class="menu-list"><a href="/auth/?return=/galen/">Авторизоваться</a></div>'}accountBtn.onclick=()=>menu.classList.toggle('open');document.addEventListener('click',e=>{if(!e.target.closest('.account-wrap'))menu.classList.remove('open')});newChatBtn.onclick=()=>createChat();i.oninput=()=>{i.style.height='auto';i.style.height=Math.min(i.scrollHeight,160)+'px'};f.onsubmit=e=>{e.preventDefault();const v=i.value.trim();if(!v)return;add(v,1);i.value='';i.style.height='44px';setTimeout(()=>add(r[Math.floor(Math.random()*r.length)],0),450)};renderAll();</script></body></html>
