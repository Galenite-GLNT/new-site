<!doctype html><html><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Galenite Galen</title><style>*{box-sizing:border-box}body{margin:0;height:100vh;overflow:hidden;background:#f3f3f1;color:#111;font-family:Inter,Arial,sans-serif}.app{height:100vh;display:grid;grid-template-columns:320px 1fr}aside{padding:28px;border-right:1px solid rgba(0,0,0,.08);background:rgba(255,255,255,.58);display:flex;flex-direction:column;gap:24px}.logo{font-size:13px;font-weight:700;letter-spacing:.3em;color:#111;text-decoration:none}.card{padding:24px;border-radius:28px;background:rgba(255,255,255,.72);border:1px solid rgba(0,0,0,.06)}.card small{font-size:11px;letter-spacing:.22em;color:#666}.card h1{margin:12px 0 0;font-size:64px;line-height:.9;letter-spacing:-.08em}.card p{margin:16px 0 0;color:#666;line-height:1.6}nav{display:flex;flex-direction:column;gap:10px}nav a{color:#555;text-decoration:none;padding:14px 16px;border-radius:18px;background:rgba(0,0,0,.04)}.chat{height:100vh;display:grid;grid-template-rows:72px 1fr 104px}header{display:flex;align-items:center;justify-content:space-between;padding:0 28px;border-bottom:1px solid rgba(0,0,0,.08);background:rgba(255,255,255,.5)}header span{color:#555}header button{border:0;border-radius:999px;padding:12px 16px;background:rgba(0,0,0,.06)}.messages{padding:28px;overflow:auto;display:flex;flex-direction:column;gap:18px}.msg{display:flex;gap:14px;max-width:780px}.msg b{width:42px;height:42px;min-width:42px;border-radius:50%;display:flex;align-items:center;justify-content:center;background:#111;color:#fff}.msg p{margin:0;padding:18px 20px;border-radius:24px;background:rgba(255,255,255,.78);border:1px solid rgba(0,0,0,.06);line-height:1.65}.composer{padding:22px 28px;display:flex;gap:14px;border-top:1px solid rgba(0,0,0,.08);background:rgba(255,255,255,.5)}textarea{flex:1;min-height:60px;max-height:160px;resize:none;border:0;outline:0;border-radius:24px;padding:18px 20px;background:rgba(255,255,255,.9);font:16px Inter,Arial,sans-serif}form button{border:0;border-radius:999px;background:#111;color:#fff;padding:0 28px;font-weight:600}@media(max-width:900px){.app{grid-template-columns:1fr}aside{display:none}.chat{grid-template-rows:64px 1fr 96px}}</style></head><body><main class="app"><aside><a class="logo" href="/">GALENITE</a><div class="card"><small>GALEN CHAT</small><h1>GALEN</h1><p>AI assistant inside Galenite ecosystem.</p></div><nav><a href="/ai-office">AI Office</a><a href="/products">Products</a><a href="/">Main</a></nav></aside><section class="chat"><header><span>Galen is online</span><button id="clearChat">Clear</button></header><div id="messages" class="messages"><div class="msg bot"><b>G</b><p>Привет. Я Гален. Напиши задачу.</p></div></div><form class="composer" id="chatForm"><textarea id="messageInput" placeholder="Message"></textarea><button>Send</button></form></section></main><script src="./script.js"></script></body></html>
