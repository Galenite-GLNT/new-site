<!doctype html><html><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Galen</title><style>*{box-sizing:border-box}body{margin:0;background:#f5f5f3;color:#111;font-family:Inter,Arial,sans-serif;height:100vh;overflow:hidden}.app{display:grid;grid-template-columns:260px 1fr;height:100vh}.sidebar{padding:28px 24px;border-right:1px solid rgba(0,0,0,.06);display:flex;flex-direction:column;justify-content:space-between}.logo{font-size:12px;letter-spacing:.34em;font-weight:700}.sidebar-top{display:flex;flex-direction:column;gap:28px}.hero small{font-size:11px;letter-spacing:.24em;color:#777}.hero h1{margin:12px 0 0;font-size:82px;line-height:.88;letter-spacing:-.1em}.hero p{margin:18px 0 0;color:#666;line-height:1.7;font-size:15px;max-width:180px}.nav{display:flex;flex-direction:column;gap:10px}.nav a{text-decoration:none;color:#666;font-size:14px;transition:.25s}.nav a:hover{color:#111;transform:translateX(4px)}.chat{display:grid;grid-template-rows:80px 1fr 120px;height:100vh}.topbar{display:flex;align-items:center;justify-content:space-between;padding:0 36px;border-bottom:1px solid rgba(0,0,0,.06)}.status{display:flex;align-items:center;gap:10px;color:#666}.dot{width:8px;height:8px;border-radius:50%;background:#111}.topbar button{border:0;background:rgba(0,0,0,.05);border-radius:999px;padding:14px 18px}.messages{padding:48px 36px;overflow:auto;display:flex;flex-direction:column;gap:24px}.message{display:flex;gap:18px;max-width:760px}.avatar{width:44px;height:44px;min-width:44px;border-radius:50%;background:#111;color:#fff;display:flex;align-items:center;justify-content:center;font-weight:700}.bubble{padding:22px 24px;border-radius:30px;background:#fff;line-height:1.75;border:1px solid rgba(0,0,0,.05);box-shadow:0 10px 40px rgba(0,0,0,.03)}.composer-wrap{padding:28px 36px;border-top:1px solid rgba(0,0,0,.06)}.composer{height:64px;border-radius:999px;background:#fff;border:1px solid rgba(0,0,0,.05);display:flex;align-items:center;padding:10px 10px 10px 24px;box-shadow:0 10px 40px rgba(0,0,0,.03)}textarea{flex:1;border:0;outline:0;resize:none;background:transparent;font:16px Inter,sans-serif;padding-top:8px;color:#111}textarea::placeholder{color:#888}.send{width:120px;height:44px;border-radius:999px;border:0;background:#111;color:#fff;font-weight:600}@media(max-width:900px){.app{grid-template-columns:1fr}.sidebar{display:none}.chat{grid-template-rows:72px 1fr 100px}.messages{padding:24px}.composer-wrap{padding:18px}}</style></head><body><main class="app"><aside class="sidebar"><div class="sidebar-top"><div class="logo">GALENITE</div><div class="hero"><small>GALEN CHAT</small><h1>GALEN</h1><p>AI assistant for the Galenite ecosystem.</p></div></div><nav class="nav"><a href="/ai-office">AI Office</a><a href="/products">Products</a><a href="/">Main</a></nav></aside><section class="chat"><header class="topbar"><div class="status"><div class="dot"></div><span>Galen is online</span></div><button id="clearChat">Clear</button></header><div class="messages" id="messages"><div class="message"><div class="avatar">G</div><div class="bubble">Привет. Я Гален. Могу помочь с архитектурой, дизайном, автоматизацией и продуктами Galenite.</div></div></div><div class="composer-wrap"><form class="composer" id="chatForm"><textarea id="messageInput" placeholder="Message Galen..."></textarea><button class="send">Send</button></form></div></section></main><script src="./script.js"></script></body></html>
